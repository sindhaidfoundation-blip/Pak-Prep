name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "App.tsx"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Build installable APK
        working-directory: android
        run: |
          for attempt in 1 2 3 4; do
            echo "Android release build attempt $attempt/4"
            if ./gradlew assembleRelease --no-daemon; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              exit "$status"
            fi
            delay=$((attempt * 30))
            echo "Gradle build failed; retrying in ${delay}s (temporary Maven rate limits can cause HTTP 429)."
            sleep "$delay"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pak-prep-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
